[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "myra-termux"
version = "0.4.1"
description = "MYRA AI assistant for Termux (Android) and Linux: chat, voice, 148+ languages and device control via Gemini"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Proprietary" }
keywords = ["termux", "android", "assistant", "gemini", "voice", "myra"]
classifiers = [
  "Environment :: Console",
  "Operating System :: Android",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
myra-termux = "myra_termux.cli:main"

[tool.setuptools]
packages = ["myra_termux"]

[tool.setuptools.package-data]
myra_termux = ["assets/*.jpg"]
